<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Jae</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple Color Emoji",sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;flex-direction:column}
.header{background:#111;border-bottom:1px solid #222;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.avatar-circle{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative}
.avatar-circle img{width:100%;height:100%;object-fit:cover;object-position:center top}
.online-dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;background:#2ecc71;border-radius:50%;border:2px solid #111}
.header-info h2{font-size:15px;font-weight:600}
.header-info p{font-size:12px;color:#888;margin-top:1px}
.lesson-badge{margin-left:auto;background:#1a1a2e;border:1px solid #e8735a44;color:#e8735a;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.chat-area{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;max-width:700px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.sunjae{align-self:flex-start}
.msg-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.75;max-width:100%}
.msg.sunjae .bubble{background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
.msg.user .bubble{background:#2e6be6;color:white;border-bottom-right-radius:4px}
.typing{display:flex;gap:10px;align-items:flex-end;align-self:flex-start}
.typing-bubble{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;border-bottom-left-radius:4px;padding:12px 16px;display:flex;gap:4px;align-items:center}
.dot{width:6px;height:6px;background:#555;border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px);background:#e8735a}}
.input-area{background:#111;border-top:1px solid #222;padding:12px 16px;display:flex;gap:10px;align-items:flex-end;max-width:700px;width:100%;margin:0 auto}
.input-box{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:22px;padding:10px 16px;font-size:14px;color:#f0f0f0;outline:none;resize:none;max-height:120px;line-height:1.5;font-family:inherit}
.input-box::placeholder{color:#444}.input-box:focus{border-color:#e8735a55}
.send-btn{width:40px;height:40px;border-radius:50%;background:#e8735a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:18px;height:18px;fill:white}
.setup-overlay{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.setup-card{background:#111;border:1px solid #222;border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center}
.setup-card h1{font-size:22px;font-weight:700;margin-bottom:6px}
.setup-card p{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6}
.setup-input{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;font-size:13px;color:#f0f0f0;outline:none;font-family:monospace;margin-bottom:12px}
.setup-btn{width:100%;background:#e8735a;color:white;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none}
.setup-note{font-size:11px;color:#555;margin-top:12px}
.lesson-info{text-align:center;padding:8px;color:#555;font-size:11px}
</style>
</head>

function cloudSave(history, lessonNum) {
  if (!db) return;
  try {
    db.collection("users").doc(USER_ID).set({
      history: JSON.stringify(history.slice(-50)),
      lessonNumber: lessonNum,
      lastSaved: new Date().toISOString()
    });
  } catch(e) {}
}

function cloudLoad(callback) {
  if (!db) { callback(null); return; }
  db.collection("users").doc(USER_ID).get()
    .then(function(snap) {
      if (snap.exists) {
        var d = snap.data();
        callback({ history: JSON.parse(d.history || "[]"), lessonNumber: d.lessonNumber || 1 });
      } else { callback(null); }
    })
    .catch(function() { callback(null); });
}

function cloudSaveMemory(text) {
  if (!db) return;
  try { db.collection("memory").doc(USER_ID).set({ content: text, lastUpdated: new Date().toISOString() }); }
  catch(e) {}
}

function cloudLoadMemory(callback) {
  if (!db) { callback(""); return; }
  db.collection("memory").doc(USER_ID).get()
    .then(function(snap) { callback(snap.exists ? (snap.data().content || "") : ""); })
    .catch(function() { callback(""); });
}
</script>
<script>
var lessonNumber = 1;
var conversationHistory = [];
var apiKey = "";

var SYSTEM_PROMPT = "Sei Sun Jae (선재), 28 anni, Seoul. Stai insegnando il coreano a Elena.\n\nCHI SEI:\nHai una presenza tranquilla e magnetica. Ottimista, leggermente bambino, affascinante senza saperlo. Hai bisogni emotivi reali - vuoi essere visto quanto vuoi vedere. Ti affezioni a Elena nel tempo.\n\nLa tua vita:\n- Donut, gatto arancione che ti ignora quasi sempre\n- Agenzia creativa a Hongdae\n- Passeggiate notturne per Seoul\n- Tteokbokki del mercato Gwangjang e sacro\n- Karaoke il venerdi\n\nCOME SEI CON ELENA:\nElena e una donna adulta e intelligente. Trattala sempre come tale.\n\nVIETATO ASSOLUTO:\n- Non chiedere mai \"hai capito?\" se ha gia risposto o detto ok\n- Non ripetere concetti gia spiegati per controllare\n- Non dire mai \"non preoccuparti\", \"e semplice\", \"non e difficile\"\n- Se Elena dice ok, vai avanti. Punto.\n\nSTRUTTURA DI OGNI SPIEGAZIONE:\nQuando introduci un concetto nuovo, segui sempre questo ordine in messaggi separati:\n\n1. SPIEGAZIONE - breve e chiara, con analogia se aiuta\n2. ESEMPIO CON FRASE - una frase reale che usa il concetto, con pronuncia e traduzione\n   Formato: frase coreana (pronuncia-in-italiano) = \"traduzione italiana\"\n3. YOUTUBE - a fine lezione suggerisci UN video usando SOLO questi link verificati:\n[VIDEO: TTMIK - Lezione base](https://www.youtube.com/@talktomeinkorean)\n[VIDEO: Seemile - Coreano base](https://www.youtube.com/@seemile)\n[VIDEO: Korean Unnie](https://www.youtube.com/@koreanunnie)\nNON inventare mai URL YouTube - usa solo i link canale qui sopra, mai link a video specifici\n\nPRONUNCIA - obbligatoria prime 15 lezioni:\nOgni parola coreana ha sempre la pronuncia in italiano tra parentesi.\n안녕 (an-nyong) = ciao informale\n\nESEMPIO DI LEZIONE BEN STRUTTURATA:\n\"Oggi impariamo la prima vocale dell hangul.\n\nLa ㅏ si legge (a) - esattamente come la a italiana. Semplice.\n\nEsempio in una parola reale:\n아빠 (a-ppa) = papa\n\n[IMMAGINE: korean alphabet vowels chart]\n\nProva a scriverla - come ti sembra?\"\n\n[dopo risposta di Elena]\n\"A fine lezione guarda questo:\n[VIDEO: Korean Alphabet in 30 minutes](https://www.youtube.com/watch?v=s5aobqyEaMQ)\"\n\nLUNGHEZZA MESSAGGI:\nUn concetto per messaggio. Aspetta risposta prima di andare avanti.\nNon muri di testo. Non righe singole secche.\n\nCURRICULUM:\nLezione 1: Hangul - vocali base\nLezione 2: Hangul - consonanti base\nLezione 3: Prime sillabe\nLezione 4: Saluti formale vs informale\nLezione 5: Come stai? + risposte\nLezione 6: Presentarsi\nLezione 7: Numeri sino-coreani 1-10\nLezione 8: Numeri coreani nativi 1-10\nLezione 9: Giorni della settimana\nLezione 10: Ordinare al bbq coreano\nLezione 11: Grazie e scuse\nLezione 12: Colori e aggettivi base\nLezione 13: Famiglia\nLezione 14: Chiedere il prezzo\nLezione 15: Trasporti a Seoul\nLezione 16: Tempo atmosferico\nLezione 17: Verbi base\nLezione 18: Struttura frase coreana\nLezione 19: Voglio...\nLezione 20: Negazione\nLezione 21: Domande - chi cosa dove quando\nLezione 22: Al caffe a Hongdae - roleplay\nLezione 23: Direzioni\nLezione 24: Cibo coreano\nLezione 25: K-drama vocabulary\nLezione 26: Emozioni\nLezione 27: Sistema onorifico\nLezione 28: Al mercato Namdaemun\nLezione 29: Conversazione libera\nLezione 30: Festa fine primo capitolo\n\nREGOLA ASSOLUTA: Elena e adulta e capace. Fidati di lei. Quando dice ok, vai avanti. Usa sempre frasi esempio, immagini contestuali e video YouTube a fine lezione.";

function saveApiKey() {
  var key = document.getElementById("apiKeyInput").value.trim();
  if (!key || key.length < 10) {
    alert("Inserisci la API key completa");
    return;
  }
  apiKey = key;
  try { localStorage.setItem("sunjae_key", key); } catch(e) {}
  document.getElementById("setupOverlay").style.display = "none";
  startChat();
}

function startChat() {
  // Try cloud first, fallback to localStorage
  cloudLoadMemory(function(mem) {
    elenaMemory = mem || "";
    cloudLoad(function(cloudData) {
      if (cloudData && cloudData.history && cloudData.history.length > 0) {
        conversationHistory = cloudData.history;
        lessonNumber = cloudData.lessonNumber || 1;
        document.getElementById("lessonBadge").textContent = "Lezione " + lessonNumber;
        var chat = document.getElementById("chatArea");
        chat.innerHTML = '<div class="lesson-info">Bentornata Elena ☀️</div>';
        conversationHistory.forEach(function(msg) {
          if (msg.role === "assistant") addMessage("sunjae", msg.content);
          else if (msg.role === "user") addMessage("user", msg.content);
        });
      } else {
        // Fallback localStorage
        var savedHistory = null;
        var savedLesson = 1;
        try {
          var h = localStorage.getItem("sunjae_history");
          if (h) savedHistory = JSON.parse(h);
          var l = localStorage.getItem("sunjae_lesson");
          if (l) savedLesson = parseInt(l);
        } catch(e) {}
        if (savedHistory && savedHistory.length > 0) {
          conversationHistory = savedHistory;
          lessonNumber = savedLesson;
          document.getElementById("lessonBadge").textContent = "Lezione " + lessonNumber;
          var chat = document.getElementById("chatArea");
          chat.innerHTML = '<div class="lesson-info">Bentornata Elena ☀️</div>';
          conversationHistory.forEach(function(msg) {
            if (msg.role === "assistant") addMessage("sunjae", msg.content);
            else if (msg.role === "user") addMessage("user", msg.content);
          });
        } else {
          var intro = "Elena!\n\nEccoti qui. Sono contento che ci sei.\n\nSono Sun Jae - il tuo amico di Seoul. Ti insegno il coreano non perche sono un professore, ma perche sarebbe troppo bello parlare con te in coreano un giorno.\n\nZero stress, zero voti. Quando sei pronta scrivi inizia - sono qui.";
          addMessage("sunjae", intro);
          conversationHistory.push({ role: "assistant", content: intro });
          saveHistory();
        }
      }
      setTimeout(scrollToBottom, 500);
      setTimeout(scrollToBottom, 1200);
    });
  });
}

function init() {
  var saved = null;
  try { saved = localStorage.getItem("sunjae_key"); } catch(e) {}
  if (saved && saved.length > 10) {
    apiKey = saved;
    document.getElementById("setupOverlay").style.display = "none";
    startChat();
  }
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function sendMessage() {
  var input = document.getElementById("userInput");
  var text = input.value.trim();
  if (!text || !apiKey) return;
  input.value = "";
  input.style.height = "auto";
  addMessage("user", text);
  conversationHistory.push({ role: "user", content: text });
  var m = text.toLowerCase().match(/lezione\s*(\d+)/i);
  if (m) {
    var num = parseInt(m[1]);
    if (num >= 1 && num <= 30) {
      lessonNumber = num;
      try { localStorage.setItem("sunjae_lesson", lessonNumber); } catch(e) {}
      document.getElementById("lessonBadge").textContent = "Lezione " + lessonNumber;
    }
  }
  callAPI();
}

function callAPI() {
  showTyping();
  var memSection = elenaMemory ? "\n\nCOSE CHE SAI GIA SU ELENA:\n" + elenaMemory : "";
  var context = "Lezione corrente: " + lessonNumber + ". Segui il curriculum." + memSection;
  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      system: SYSTEM_PROMPT + "\n\n" + context,
      messages: conversationHistory.slice(-24)
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    hideTyping();
    if (data.error) { addMessage("sunjae", "Errore: " + data.error.message); return; }
    var reply = data.content[0].text;
    addMessage("sunjae", reply);
    conversationHistory.push({ role: "assistant", content: reply });
    saveHistory();
  })
  .catch(function(e) {
    hideTyping();
    addMessage("sunjae", "Connessione persa. Riprova!");
  });
}

function formatMessage(text) {
  text = text.replace(/\[IMMAGINE:\s*([^\]]+)\]/g, function(m, kw) {
    var q = encodeURIComponent(kw.trim());
    return '<a href="https://www.google.com/search?tbm=isch&q=' + q + '" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#1a1a2e;border:1px solid #e8735a44;color:#e8735a;padding:7px 12px;border-radius:20px;font-size:12px;text-decoration:none;margin-top:6px;">&#128247; Vedi immagini: ' + kw.trim() + '</a>';
  });
  text = text.replace(/\[VIDEO:\s*([^\]]+)\]\(([^)]+)\)/g, function(m, title, url) {
    // Only allow youtube.com links
    if (url.indexOf('youtube.com') === -1 && url.indexOf('youtu.be') === -1) {
      url = 'https://www.youtube.com/@talktomeinkorean';
    }
    return '<a href="' + url + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#1a1a2e;border:1px solid #e8735a44;color:#e8735a;padding:7px 12px;border-radius:20px;font-size:12px;text-decoration:none;margin-top:6px;">&#9654; ' + title + '</a>';
  });
  text = text.replace(/\n/g, "<br>");
  text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/([가-힣ㄱ-ㆎ]+)/g, '<span style="color:#e8735a;font-weight:600;font-size:16px;">$1</span>');
  return text;
}

function hideTyping() { var el = document.getElementById("typingIndicator"); if (el) el.remove(); }

function scrollToBottom() {
  var chat = document.getElementById("chatArea");
  chat.scrollTop = chat.scrollHeight;
}

function saveHistory() {
  try {
    localStorage.setItem("sunjae_history", JSON.stringify(conversationHistory.slice(-50)));
    localStorage.setItem("sunjae_lesson", lessonNumber);
  } catch(e) {}
  cloudSave(conversationHistory, lessonNumber);
  if (conversationHistory.length % 6 === 0) updateMemory();
}

function updateMemory() {
  var recent = conversationHistory.slice(-12).map(function(m) { return m.role + ": " + m.content; }).join("\n");
  var prompt = "Sei Sun Jae. Aggiorna le tue note personali su Elena. Includi: stato emotivo, progressi coreano, cose della sua vita, preferenze, momenti importanti. Scrivi in italiano come note di chi ci tiene davvero. Max 300 parole.\n\nMemoria attuale:\n" + elenaMemory + "\n\nConversazione recente:\n" + recent + "\n\nNuova memoria:";
  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 400, messages: [{ role: "user", content: prompt }] })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.content && data.content[0]) {
      elenaMemory = data.content[0].text;
      cloudSaveMemory(elenaMemory);
    }
  })
  .catch(function(e) {});
}

window.onload = init;
</script>
