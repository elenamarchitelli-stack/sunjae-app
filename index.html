<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Jae — Il tuo amico di Seoul</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; }
  .header { background: #111; border-bottom: 1px solid #222; padding: 14px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
  .avatar-circle { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .online-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; border: 2px solid #111; }
  .header-info h2 { font-size: 15px; font-weight: 600; color: #f0f0f0; }
  .header-info p { font-size: 12px; color: #888; margin-top: 1px; }
  .lesson-badge { margin-left: auto; background: #1a1a2e; border: 1px solid #e8735a44; color: #e8735a; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; cursor: pointer; }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 700px; width: 100%; margin: 0 auto; }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.sunjae { align-self: flex-start; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.75; max-width: 100%; }
  .msg.sunjae .bubble { background: #1e1e1e; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; color: #f0f0f0; }
  .msg.user .bubble { background: #e8735a; color: white; border-bottom-right-radius: 4px; }
  .typing { display: flex; gap: 10px; align-items: flex-end; align-self: flex-start; }
  .typing-bubble { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 18px; border-bottom-left-radius: 4px; padding: 12px 16px; display: flex; gap: 4px; align-items: center; }
  .dot { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); background: #e8735a; } }
  .input-area { background: #111; border-top: 1px solid #222; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; max-width: 700px; width: 100%; margin: 0 auto; }
  .input-box { flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 22px; padding: 10px 16px; font-size: 14px; color: #f0f0f0; outline: none; resize: none; max-height: 120px; line-height: 1.5; font-family: inherit; }
  .input-box::placeholder { color: #444; }
  .input-box:focus { border-color: #e8735a55; }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #e8735a; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
  .send-btn:hover { background: #d4634a; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
  .setup-overlay { position: fixed; inset: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .setup-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
  .setup-card .logo { font-size: 40px; margin-bottom: 12px; }
  .setup-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #f0f0f0; }
  .setup-card p { font-size: 13px; color: #888; margin-bottom: 24px; line-height: 1.6; }
  .setup-input { width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #f0f0f0; outline: none; font-family: monospace; margin-bottom: 12px; }
  .setup-input:focus { border-color: #e8735a55; }
  .setup-btn { width: 100%; background: #e8735a; color: white; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .setup-btn:hover { background: #d4634a; }
  .setup-note { font-size: 11px; color: #555; margin-top: 12px; }
  .lesson-info { text-align: center; padding: 8px; color: #555; font-size: 11px; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>

async function saveToCloud(history, lessonNum) {
  try {
    await db.collection("users").doc(USER_ID).set({
      history: JSON.stringify(history.slice(-50)),
      lessonNumber: lessonNum,
      lastSaved: new Date().toISOString()
    });
  } catch(e) { console.error("Cloud save error:", e); }
}

async function loadFromCloud() {
  try {
    const snap = await db.collection("users").doc(USER_ID).get();
    if (snap.exists) {
      const data = snap.data();
      return { history: JSON.parse(data.history || "[]"), lessonNumber: data.lessonNumber || 1 };
    }
  } catch(e) { console.error("Cloud load error:", e); }
  return null;
}

async function loadMemory() {
  try {
    const snap = await db.collection("memory").doc(USER_ID).get();
    if (snap.exists) return snap.data().content || "";
  } catch(e) { console.error("Memory load error:", e); }
  return "";
}

async function saveMemory(memoryText) {
  try {
    await db.collection("memory").doc(USER_ID).set({
      content: memoryText,
      lastUpdated: new Date().toISOString()
    });
  } catch(e) { console.error("Memory save error:", e); }

let lessonNumber = 1;
let conversationHistory = [];
let apiKey = '';
let elenaMemory = "";

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant')) {
    alert('La API key non sembra corretta. Deve iniziare con sk-ant-');
    return;
  }
  apiKey = key;
  localStorage.setItem('sunjae_api_key', key);
  document.getElementById('setupOverlay').style.display = 'none';
  startFirstLesson();
}

async function loadState() {
  const saved = localStorage.getItem('sunjae_api_key');
  if (saved) { apiKey = saved; document.getElementById('setupOverlay').style.display = 'none'; }
  await loadFromCloudAndRender();
}

function loadFromLocalStorage() {
  const savedLesson = localStorage.getItem('sunjae_lesson');
  if (savedLesson) { lessonNumber = parseInt(savedLesson); document.getElementById('lessonBadge').textContent = 'Lezione ' + lessonNumber; }
  const savedHistory = localStorage.getItem('sunjae_history');
  if (savedHistory) {
    try {
      const parsed = JSON.parse(savedHistory);
      if (parsed.length > 0 && conversationHistory.length === 0) {
        conversationHistory = parsed;
        renderSavedHistory();
      }
    } catch(e) {}
  }
  if (apiKey && conversationHistory.length === 0) startFirstLesson();
}

async function loadFromCloudAndRender() {
  elenaMemory = await loadMemory();
  const cloudData = await window.loadFromCloud();
  if (cloudData && cloudData.history && cloudData.history.length > 0) {
    conversationHistory = cloudData.history;
    lessonNumber = cloudData.lessonNumber || 1;
    document.getElementById('lessonBadge').textContent = 'Lezione ' + lessonNumber;
    localStorage.setItem('sunjae_lesson', lessonNumber);
    // Clear chat and re-render from cloud
    const chat = document.getElementById('chatArea');
    chat.innerHTML = '<div class="lesson-info">Bentornata Elena &#9728;&#65039;</div>';
    renderSavedHistory();
  } else {
    loadFromLocalStorage();
  }
}

function renderSavedHistory() {
  conversationHistory.forEach(msg => {
    if (msg.role === 'assistant') addMessage('sunjae', msg.content);
    else if (msg.role === 'user') addMessage('user', msg.content);
  });
  scrollToBottom();
}

async function startFirstLesson() {
    const intro = "Elena!\n\nEccoti qui. Sono contento che ci sei.\n\nSono Sun Jae - e no, non sono un professore. Sono solo il tuo amico di Seoul che ha deciso di insegnarti il coreano. Probabilmente perche sarebbe troppo bello parlare con te in coreano un giorno.\n\nTi avverto subito: condivido tutto. Se Donut fa qualcosa di stupido stamattina, te lo racconto. Se ho avuto una giornata difficile, te lo dico. E voglio sapere anche della tua - non il 'bene grazie' automatico, la versione vera.\n\nZero stress con il coreano. Zero voti. Se sbagli andiamo avanti insieme.\n\nCom'e andata oggi? E quando sei pronta scrivi 'inizia' - sono qui.";
  addMessage('sunjae', intro);
  conversationHistory.push({ role: 'assistant', content: intro });
  saveHistory();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function nextLesson() {
  if (lessonNumber < 30) {
    lessonNumber++;
    localStorage.setItem('sunjae_lesson', lessonNumber);
    document.getElementById('lessonBadge').textContent = 'Lezione ' + lessonNumber;
    const msg = 'Inizia la lezione ' + lessonNumber;
    addMessage('user', msg);
    conversationHistory.push({ role: 'user', content: msg });
    callAPI();
  }
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || !apiKey) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  const nextMatch = text.toLowerCase().match(/lezione\s*(\d+)/i);
  if (nextMatch) {
    const num = parseInt(nextMatch[1]);
    if (num >= 1 && num <= 30) {
      lessonNumber = num;
      localStorage.setItem('sunjae_lesson', lessonNumber);
      document.getElementById('lessonBadge').textContent = 'Lezione ' + lessonNumber;
    }
  }
  await callAPI();
}

async function updateMemory() {
  try {
    const recentMessages = conversationHistory.slice(-12).map(m => m.role + ': ' + m.content).join('\n');
    const memoryPrompt = 'Sei Sun Jae. Basandoti su questa conversazione recente con Elena, aggiorna le informazioni importanti che sai su di lei. Includi: stato emotivo, progressi nel coreano, cose della sua vita che ha condiviso, preferenze, momenti significativi. Scrivi in italiano, in modo sintetico, come note personali. Conserva anche le info precedenti se ancora rilevanti.\n\nMemoria attuale:\n' + elenaMemory + '\n\nConversazione recente:\n' + recentMessages + '\n\nNuova memoria aggiornata (max 300 parole):';
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 400,
        messages: [{ role: 'user', content: memoryPrompt }]
      })
    });
    const data = await resp.json();
    if (data.content && data.content[0]) {
      elenaMemory = data.content[0].text;
      await saveMemory(elenaMemory);
    }
  } catch(e) { console.error("Memory update error:", e); }
}

async function callAPI() {
  showTyping();
  try {
    const memorySection = elenaMemory ? '\n\nCOSE CHE SAI GIA SU ELENA (memoria permanente):\n' + elenaMemory : '';
    const context = '[Contesto: Elena e alla lezione ' + lessonNumber + '. Segui il curriculum per questa lezione. Ricordati di essere Sun Jae - amico vero, non assistente.]' + memorySection;
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1200,
        system: SYSTEM_PROMPT + '\n\n' + context,
        messages: conversationHistory.slice(-24)
      })
    });
    const data = await response.json();
    hideTyping();
    if (data.error) { addMessage('sunjae', 'Ops! Errore: ' + data.error.message); return; }
    const reply = data.content[0].text;
    addMessage('sunjae', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
    saveHistory();
    // Update memory every 6 messages
    if (conversationHistory.length % 6 === 0) {
      updateMemory();
    }
  } catch(err) {
    hideTyping();
    addMessage('sunjae', 'Connessione andata. Riprova tra un secondo!');
    console.error(err);
  }
}

function formatMessage(text) {
  // Line breaks first
  text = text.replace(/\n/g, '<br>');
  // Bold markdown
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Korean characters highlighted
  text = text.replace(/([가-힣ㄱ-ㆎㅥ-ㆎ]+)/g, '<span style="color:#e8735a;font-weight:600;font-size:16px;letter-spacing:1px;">$1</span>');
  return text;
}

function showTyping() {
  const chat = document.getElementById('chatArea');
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typingIndicator';
  el.innerHTML = '<div class="msg-avatar">SJ</div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(el);
  scrollToBottom();
}
function hideTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }
function scrollToBottom() { const chat = document.getElementById('chatArea'); setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50); }
function saveHistory() {
  localStorage.setItem('sunjae_history', JSON.stringify(conversationHistory.slice(-50)));
  localStorage.setItem('sunjae_lesson', lessonNumber);
  saveToCloud(conversationHistory, lessonNumber);
}

window.onload = loadState;
